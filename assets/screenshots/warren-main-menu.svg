<text x="50%" y="28" text-anchor="middle" font-family="Menlo, Monaco, Consolas, monospace" font-size="14" fill="#aeb6c2">Warren TUI</text>
<g font-family="Menlo, Monaco, Consolas, monospace" font-size="22" fill="#e7edf4">
<text x="38" y="82" fill="#e7edf4">╔══════════════════════════════════════════════════════════════╗</text>
<text x="38" y="114" fill="#e7edf4">║                         Warren Setup                         ║</text>
<text x="38" y="146" fill="#e7edf4">╠══════════════════════════════════════════════════════════════╣</text>
<text x="38" y="178" fill="#e7edf4">║ Этот скрипт с любовью разработал для тебя delonet-ai.         ║</text>
<text x="38" y="210" fill="#e7edf4">║ Просто следуй шагам. Если что-то пошло не так —               ║</text>
<text x="38" y="242" fill="#e7edf4">║ перезапускай скрипт. У тебя все получится 💪                  ║</text>
<text x="38" y="274" fill="#e7edf4">╚══════════════════════════════════════════════════════════════╝</text>
<text x="38" y="306" fill="#7bd88f">Версия Warren: 0.6.x</text>
<text x="38" y="338" fill="#e7edf4"></text>
<text x="38" y="370" fill="#ffd166">ВАЖНО  После любого ребута или обрыва просто запусти одной командой: warren</text>
<text x="38" y="402" fill="#7bd88f">Путь конфигов VPS: /etc/warren/vps/reports</text>
<text x="38" y="434" fill="#e7edf4"></text>
<text x="38" y="466" fill="#f5f7fa">Главное меню:</text>
<text x="38" y="498" fill="#e7edf4">0) Полный авторежим</text>
<text x="38" y="530" fill="#e7edf4">1) Базовые настройки</text>
<text x="38" y="562" fill="#e7edf4">2) Добавить UI Warren в роутер</text>
<text x="38" y="594" fill="#e7edf4">3) Настрой мне VPS</text>
<text x="38" y="626" fill="#e7edf4">4) Podkop</text>
<text x="38" y="658" fill="#e7edf4">5) Доустановить Amnezia в Podkop</text>
<text x="38" y="690" fill="#e7edf4">6) QoS для Amnezia</text>
<text x="38" y="722" fill="#e7edf4">7) Управление Amnezia клиентами</text>
<text x="38" y="754" fill="#e7edf4">8) Remote Admin</text>
<text x="38" y="786" fill="#ffd166">9) USB модем настрой (WIP, Milestone 11)</text>
<text x="38" y="818" fill="#e7edf4">10) Telegram-бот для Podkop</text>
<text x="38" y="850" fill="#e7edf4">11) Диагностика Podkop/VPS</text>
<text x="38" y="882" fill="#e7edf4">12) Проверка SNI-кандидатов Reality</text>
<text x="38" y="914" fill="#e7edf4">13) Применить SNI к VPS/Podkop</text>
<text x="38" y="946" fill="#ffd166">14) NaiveProxy (WIP, Milestone 12)</text>
<text x="38" y="978" fill="#ffd166">15) Shadowsocks fallback (WIP, Milestone 9)</text>
<text x="38" y="1010" fill="#e7edf4">16) Remote Admin Console (Mac)</text>
<text x="38" y="1042" fill="#ffd166">99) Установить всё из РФ сегмента (WIP, Milestone 10)</text>
<text x="38" y="1074" fill="#8bd3ff">Ввод (0-16, 99) [0]: _</text>
